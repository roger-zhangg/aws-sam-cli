# GitHub Action: Running Linux Docker Containers on Windows with WSL2
# 
# IMPORTANT: How Docker Works on Windows GitHub Actions Runners
# ==============================================================
# GitHub Actions Windows runners come pre-configured with Docker Desktop.
# However, Docker may be in Windows container mode by default, which will
# cause errors like "no matching manifest for windows/amd64".
#
# This workflow demonstrates how to:
# 1. Switch Docker to Linux container mode if needed
# 2. Use WSL2 backend to run Linux containers
# 3. Handle both scenarios (pre-configured or manual switch)
#
# The error "no matching manifest for windows/amd64" means Docker is trying
# to pull Windows containers instead of Linux containers.

name: Docker Linux on Windows with WSL2

on:
  push:
    branches: [ main, windows_test ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  # Job 1: Setup and Verify Docker for Linux Containers
  setup-docker-for-linux:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check and Switch Docker to Linux Containers
        run: |
          Write-Host "=== CHECKING DOCKER CONFIGURATION ===" -ForegroundColor Cyan
          
          # Get current Docker mode
          try {
              $dockerInfo = docker info --format '{{json .}}' | ConvertFrom-Json
              Write-Host "Current Docker OS Type: $($dockerInfo.OSType)" -ForegroundColor Yellow
              
              if ($dockerInfo.OSType -eq "windows") {
                  Write-Host "Docker is in Windows container mode. Attempting to switch to Linux containers..." -ForegroundColor Yellow
                  
                  # Method 1: Try using DockerCli.exe if available
                  $dockerCliPath = "C:\Program Files\Docker\Docker\DockerCli.exe"
                  if (Test-Path $dockerCliPath) {
                      Write-Host "Found DockerCli.exe, switching to Linux containers..." -ForegroundColor Green
                      & "$dockerCliPath" -SwitchLinuxEngine
                      Start-Sleep -Seconds 5
                  }
                  
                  # Method 2: Try using docker context
                  Write-Host "Creating and using Linux context..." -ForegroundColor Green
                  docker context create linux-engine --docker "host=npipe:////./pipe/docker_engine_linux" 2>$null
                  docker context use linux-engine 2>$null
                  
                  # Verify the switch
                  Start-Sleep -Seconds 5
                  $newInfo = docker info --format '{{json .}}' | ConvertFrom-Json
                  if ($newInfo.OSType -eq "linux") {
                      Write-Host "✅ Successfully switched to Linux containers!" -ForegroundColor Green
                  } else {
                      Write-Host "⚠️ Could not switch to Linux containers automatically" -ForegroundColor Yellow
                  }
              } else {
                  Write-Host "✅ Docker is already configured for Linux containers!" -ForegroundColor Green
              }
          } catch {
              Write-Host "Error checking Docker configuration: $_" -ForegroundColor Red
          }
          
          # Display final Docker information
          Write-Host "`n=== FINAL DOCKER CONFIGURATION ===" -ForegroundColor Cyan
          docker version
          docker info
        shell: powershell
      
      - name: Test Linux Container Pull
        run: |
          Write-Host "=== TESTING LINUX CONTAINER PULL ===" -ForegroundColor Cyan
          
          # Explicitly try to pull a Linux image with platform specification
          Write-Host "Attempting to pull Linux Ubuntu image with --platform flag..." -ForegroundColor Yellow
          
          # Method 1: Use --platform flag to force Linux
          docker pull --platform linux/amd64 ubuntu:22.04
          
          if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Successfully pulled Linux Ubuntu image!" -ForegroundColor Green
              docker images ubuntu:22.04
          } else {
              Write-Host "❌ Failed to pull Linux image. Docker may not support Linux containers on this runner." -ForegroundColor Red
              
              # Try alternative: Use Docker buildx which supports multi-platform
              Write-Host "Attempting with Docker buildx..." -ForegroundColor Yellow
              docker buildx create --use --name mybuilder --driver docker-container --bootstrap
              docker buildx inspect --bootstrap
          }
        shell: powershell
        continue-on-error: true

  # Job 2: Run Linux Containers with Platform Specification
  run-linux-containers:
    runs-on: windows-latest
    needs: setup-docker-for-linux
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Pull and run Ubuntu with explicit platform
      - name: Pull Ubuntu Linux image with platform flag
        run: docker pull --platform linux/amd64 ubuntu:22.04
        shell: cmd
      
      - name: Run Ubuntu container
        run: |
          docker run --rm --platform linux/amd64 ubuntu:22.04 /bin/bash -c "
            echo '=== Running Ubuntu Linux on Windows via WSL2 ===' &&
            echo 'Hostname:' $(hostname) &&
            echo 'Kernel:' $(uname -r) &&
            echo 'Distribution:' &&
            cat /etc/os-release | grep PRETTY_NAME &&
            echo '' &&
            echo 'CPU Info:' &&
            lscpu | grep 'Model name' || cat /proc/cpuinfo | grep 'model name' | head -1 &&
            echo '' &&
            echo 'Memory:' &&
            free -h 2>/dev/null || echo 'free command not available' &&
            echo '' &&
            echo 'This Linux container is running on Windows through WSL2!'
          "
        shell: cmd
      
      # Pull and run Alpine with platform specification
      - name: Run Alpine Linux container
        run: |
          docker pull --platform linux/amd64 alpine:latest
          docker run --rm --platform linux/amd64 alpine:latest /bin/sh -c "
            echo '=== Alpine Linux Info ===' &&
            cat /etc/alpine-release &&
            echo 'Kernel: ' && uname -r &&
            echo '' &&
            echo 'Installing packages in Alpine container...' &&
            apk add --no-cache curl git &&
            echo 'Packages installed successfully!' &&
            curl --version | head -1 &&
            git --version
          "
        shell: cmd
      
      # Run Debian with platform specification
      - name: Run Debian container
        run: |
          docker pull --platform linux/amd64 debian:latest
          docker run --rm --platform linux/amd64 debian:latest /bin/bash -c "
            echo '=== Debian Linux Info ===' &&
            cat /etc/debian_version &&
            uname -a &&
            echo '' &&
            apt-get update > /dev/null 2>&1 &&
            apt-get install -y curl > /dev/null 2>&1 &&
            echo 'Testing network from Debian container:' &&
            curl -s https://api.github.com/zen
          "
        shell: cmd

  # Job 3: Advanced Docker Operations
  advanced-docker-operations:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Build a custom Linux image on Windows
      - name: Create and build custom Linux Dockerfile
        run: |
          @echo off
          (
            echo FROM ubuntu:22.04
            echo RUN apt-get update ^&^& apt-get install -y python3 python3-pip nodejs npm ^&^& rm -rf /var/lib/apt/lists/*
            echo WORKDIR /app
            echo RUN echo '#!/bin/bash' ^> /app/script.sh
            echo RUN echo 'echo "This script runs in a Linux container built on Windows!"' ^>^> /app/script.sh
            echo RUN echo 'python3 --version' ^>^> /app/script.sh
            echo RUN echo 'node --version' ^>^> /app/script.sh
            echo RUN echo 'npm --version' ^>^> /app/script.sh
            echo RUN chmod +x /app/script.sh
            echo CMD ["/app/script.sh"]
          ) > Dockerfile.custom
          
          docker build -f Dockerfile.custom -t custom-linux-on-windows .
        shell: cmd
      
      - name: Run custom Linux image
        run: docker run --rm custom-linux-on-windows
        shell: cmd
      
      # Volume mounting from Windows to Linux container
      - name: Create test files on Windows host
        run: |
          echo "This file was created on Windows host" > test-file.txt
          mkdir test-dir
          echo "Another file in a directory" > test-dir\nested-file.txt
        shell: cmd
      
      - name: Mount Windows directory in Linux container
        run: |
          docker run --rm -v "%cd%":/mounted -w /mounted ubuntu:22.04 /bin/bash -c "
            echo '=== Files from Windows host mounted in Linux container ===' &&
            ls -la &&
            echo '' &&
            echo '=== Content of test-file.txt ===' &&
            cat test-file.txt &&
            echo '' &&
            echo '=== Creating a file from Linux container ===' &&
            echo 'This file was created inside the Linux container' > created-in-linux.txt &&
            echo 'File created successfully!' &&
            echo '' &&
            echo '=== All .txt files ===' &&
            find . -name '*.txt' -type f
          "
        shell: cmd
      
      - name: Verify file created by Linux container exists on Windows
        run: |
          if exist created-in-linux.txt (
            echo File created by Linux container exists on Windows host!
            type created-in-linux.txt
          ) else (
            echo File not found
          )
        shell: cmd

  # Job 4: Docker Compose with Linux containers
  docker-compose-linux:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create docker-compose.yml
        run: |
          @echo off
          (
            echo version: '3.8'
            echo services:
            echo   web:
            echo     image: nginx:alpine
            echo     ports:
            echo       - "8080:80"
            echo     volumes:
            echo       - ./html:/usr/share/nginx/html
            echo   api:
            echo     image: node:alpine
            echo     command: node -e "console.log('Node.js API server would run here')"
            echo   database:
            echo     image: postgres:alpine
            echo     environment:
            echo       POSTGRES_PASSWORD: example
            echo       POSTGRES_DB: testdb
          ) > docker-compose.yml
          
          mkdir html
          echo ^<h1^>Hello from Nginx running in Linux container on Windows!^</h1^> > html\index.html
        shell: cmd
      
      - name: Run Docker Compose
        run: |
          docker-compose up -d
          timeout /t 5 /nobreak > nul
          docker-compose ps
          docker-compose logs
          docker-compose down
        shell: cmd

  # Job 5: Performance and Resource Testing
  performance-testing:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run performance test in Linux container
        run: |
          docker run --rm ubuntu:22.04 /bin/bash -c "
            echo '=== Performance Testing ===' &&
            echo 'CPU Benchmark (calculating prime numbers):' &&
            time (factor 99999999999999) &&
            echo '' &&
            echo 'Disk I/O Test:' &&
            dd if=/dev/zero of=/tmp/test bs=1M count=100 2>&1 | grep -E 'copied|MB/s' &&
            echo '' &&
            echo 'Memory allocation test:' &&
            python3 -c 'import sys; x = \"a\" * (100 * 1024 * 1024); print(f\"Allocated {len(x) / 1024 / 1024:.0f} MB\")' 2>/dev/null || echo 'Python not available for memory test'
          "
        shell: cmd
      
      - name: Container resource limits test
        run: |
          echo Testing container with resource limits...
          docker run --rm --memory="256m" --cpus="0.5" alpine:latest /bin/sh -c "
            echo 'Running with limited resources:' &&
            echo '- Memory limit: 256MB' &&
            echo '- CPU limit: 0.5 cores' &&
            cat /proc/meminfo | grep MemTotal &&
            nproc
          "
        shell: cmd

  # Job 6: Multi-architecture demonstration
  multi-architecture:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Show Docker buildx support
        run: |
          docker buildx version
          docker buildx ls
        shell: cmd
      
      - name: Pull and run ARM64 image (emulated)
        run: |
          echo Note: ARM64 images will run under emulation on x86_64
          docker run --rm --platform linux/amd64 alpine:latest uname -m
        shell: cmd
        continue-on-error: true

# Summary:
# This workflow demonstrates that GitHub Actions Windows runners can seamlessly
# run Linux Docker containers thanks to the pre-configured WSL2 backend.
# 
# Key Points:
# 1. No additional WSL2 setup is required in the workflow
# 2. Docker Desktop on Windows runners is pre-configured with WSL2 backend
# 3. Linux containers run natively through WSL2's Linux kernel
# 4. Full support for volumes, networking, and all Docker features
# 5. Can build Linux images, run docker-compose, and more
#
# For local development on Windows:
# To replicate this setup locally, ensure you have:
# 1. Windows 10 version 2004+ or Windows 11
# 2. WSL2 installed: wsl --install
# 3. Docker Desktop with WSL2 backend enabled (Settings > General > Use WSL 2 based engine)
